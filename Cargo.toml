[package]
name = "cridecoder"
version = "0.3.5"
edition = "2021"
description = "CRI codec library for ACB/AWB, HCA audio, and USM video extraction"
license = "MIT"
authors = ["Seiunx Dev"]
repository = "https://github.com/seiunx-dev/cridecoder"
homepage = "https://github.com/seiunx-dev/cridecoder"
readme = "README.md"
keywords = ["cri", "hca", "acb", "usm", "audio"]
categories = ["multimedia::audio", "multimedia::video", "parser-implementations"]
exclude = [
    "*.acb",
    "*.usm",
    "*.hca",
    "*.wav",
    "*.m2v",
    "test_output_*",
    ".DS_Store",
    ".idea/*",
    "Cargo.toml.orig",
    "tests/__pycache__/*",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
byteorder = "1"
thiserror = "2"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
rustc-hash = "2"
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
python = ["pyo3"]

[[example]]
name = "test_acb"
path = "examples/test_acb.rs"

[[example]]
name = "test_usm"
path = "examples/test_usm.rs"

[profile.release]
lto = "thin"
